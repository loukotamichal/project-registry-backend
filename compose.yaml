name: project-registry

services:
  backend:
    build: .
    pull_policy: build
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/app.sqlite
    volumes:
      - registry-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ../project-registry-frontend
    pull_policy: build
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  registry-data:
    name: project-registry-data
